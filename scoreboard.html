<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scoreboard — Fun Friday</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&family=Outfit:wght@600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <nav class="page-nav"><a href="index.html">← Back to hub</a></nav>
  <main class="page-main">
    <h1 class="page-title">Scoreboard</h1>
    <p class="page-sub">Use this as the host screen. For ~12-15 players, two teams keeps scoring simple; rename teams below.</p>

    <section class="panel">
      <div class="scoreboard" id="scoreboard-root" aria-label="Team scoreboard"></div>
      <div class="scoreboard-actions">
        <button class="btn btn-ghost" type="button" id="btn-reset">Reset scores</button>
      </div>
    </section>
  </main>

  <script src="lib/score.js"></script>
  <script src="scoreboard.js"></script>
</body>
</html>
