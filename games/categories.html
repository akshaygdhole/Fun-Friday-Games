<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Categories (2 teams) — Fun Friday</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&family=Outfit:wght@600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <nav class="page-nav"><a href="../index.html">← Back to hub</a></nav>
  <main class="page-main">
    <div id="score-widget"></div>

    <h1 class="page-title">Categories (Scattergories-lite)</h1>
    <p class="page-sub">Pick a category and letter. Each team has 60s to list items that match. Host awards points.</p>

    <section class="panel">
      <div class="quiz-meta">
        <span id="timer-label">Timer: 60s</span>
        <span id="letter-label">Letter: A</span>
      </div>

      <div class="prompt-box" id="category-box">Press “New round”.</div>

      <div class="quiz-actions" style="justify-content:center">
        <button class="btn btn-primary" type="button" id="btn-new">New round</button>
        <button class="btn btn-ghost" type="button" id="btn-start">Start 60s</button>
        <button class="btn btn-ghost" type="button" id="btn-stop" disabled>Stop</button>
      </div>

      <div class="quiz-actions" style="justify-content:center; margin-top: 0.75rem">
        <button class="btn btn-primary" type="button" id="btn-a-plus">Team A +1</button>
        <button class="btn btn-primary" type="button" id="btn-b-plus">Team B +1</button>
      </div>
    </section>
  </main>

  <script src="../lib/score.js"></script>
  <script src="../data/categories.js"></script>
  <script src="categories.js"></script>
</body>
</html>
