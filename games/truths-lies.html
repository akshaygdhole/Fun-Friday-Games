<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Two truths & a lie - Fun Friday</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&family=Outfit:wght@600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <nav class="page-nav"><a href="../index.html">Back to hub</a></nav>
  <main class="page-main">
    <div id="score-widget"></div>

    <h1 class="page-title">Two truths & a lie</h1>
    <p class="page-sub">Teams discuss which statement is the lie, then reveal. Host awards the point.</p>

    <section class="panel">
      <ol class="stmt-list" id="stmt-list"></ol>
      <div class="feedback hidden" id="reveal-box" role="status"></div>

      <div class="quiz-actions" style="justify-content:center">
        <button class="btn btn-primary" type="button" id="btn-new">New round</button>
        <button class="btn btn-ghost" type="button" id="btn-reveal" disabled>Reveal lie</button>
      </div>

      <div class="quiz-actions" style="justify-content:center; margin-top: 0.75rem">
        <button class="btn btn-primary" type="button" id="btn-a">Team A guessed right (+1)</button>
        <button class="btn btn-primary" type="button" id="btn-b">Team B guessed right (+1)</button>
      </div>

      <p class="page-sub" style="margin: 1rem 0 0">
        Edit rounds in <code>data/truths-lies.js</code>.
      </p>
    </section>
  </main>

  <script src="../lib/score.js"></script>
  <script src="../data/truths-lies.js"></script>
  <script src="truths-lies.js"></script>
</body>
</html>
