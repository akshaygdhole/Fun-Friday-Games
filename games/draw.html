<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Draw & guess (2 teams) - Fun Friday</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&family=Outfit:wght@600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <nav class="page-nav"><a href="../index.html">Back to hub</a></nav>
  <main class="page-main">
    <div id="score-widget"></div>

    <h1 class="page-title">Draw & guess</h1>
    <p class="page-sub">Draw on paper/whiteboard, or give emoji-only hints in chat. 60s turns, alternate teams. Works well with ~6-8 per side.</p>

    <section class="panel">
      <div class="quiz-meta">
        <span id="round-label">Round: 60s</span>
        <span id="turn-label">Turn: Team A</span>
      </div>

      <div class="prompt-box" id="card">Press Start turn.</div>

      <div class="quiz-actions" style="justify-content:center">
        <button class="btn btn-primary" type="button" id="btn-start">Start turn</button>
        <button class="btn btn-ghost" type="button" id="btn-pass" disabled>Pass</button>
        <button class="btn btn-primary" type="button" id="btn-correct" disabled>Correct (+1)</button>
      </div>

      <p class="page-sub" style="margin: 1rem 0 0">
        Edit prompts in <code>data/draw-prompts.js</code>.
      </p>
    </section>
  </main>

  <script src="../lib/score.js"></script>
  <script src="../data/draw-prompts.js"></script>
  <script src="draw.js"></script>
</body>
</html>
