<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rapid-fire (2 teams) - Fun Friday</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&family=Outfit:wght@600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <nav class="page-nav"><a href="../index.html">Back to hub</a></nav>
  <main class="page-main">
    <div id="score-widget"></div>

    <h1 class="page-title">Rapid-fire</h1>
    <p class="page-sub">Read the question aloud. First team to answer gets the point (honor system or raise hands). Then show the answer.</p>

    <section class="panel">
      <p class="question-text" id="q-text" style="margin-bottom: 1rem;">Press Next question.</p>
      <div class="feedback hidden" id="answer-box"></div>

      <div class="quiz-actions" style="justify-content:center">
        <button class="btn btn-primary" type="button" id="btn-next">Next question</button>
        <button class="btn btn-ghost" type="button" id="btn-show" disabled>Show answer</button>
      </div>

      <div class="quiz-actions" style="justify-content:center; margin-top: 0.75rem">
        <button class="btn btn-primary" type="button" id="btn-a">Team A +1</button>
        <button class="btn btn-primary" type="button" id="btn-b">Team B +1</button>
      </div>

      <p class="page-sub" style="margin: 1rem 0 0">
        Edit questions in <code>data/rapidfire.js</code>.
      </p>
    </section>
  </main>

  <script src="../lib/score.js"></script>
  <script src="../data/rapidfire.js"></script>
  <script src="rapidfire.js"></script>
</body>
</html>
